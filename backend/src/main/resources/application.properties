# ============================================================
# TravelTrek - Application Configuration
# ============================================================

# --- Server ---
server.port=${PORT:8080}

# --- Database ---
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:${DB_URL:jdbc:mysql://localhost:3306/traveltrek?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}}}
spring.datasource.username=${DB_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${DB_PASSWORD:${MYSQLPASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- JWT Configuration ---
app.jwt.secret=${JWT_SECRET:TravelTrekSecretKey2024VeryLongAndSecureKeyForHS256Algorithm}
app.jwt.expiration=86400000
