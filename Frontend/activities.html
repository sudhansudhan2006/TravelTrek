<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planned Activities - TravelTrek</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <!-- Navbar + sidebar injected by renderLayout() -->

  <!-- Add Activity Modal -->
  <div class="modal fade" id="activity-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="activity-form">
          <div class="modal-header">
            <h5 class="modal-title" id="activity-modal-title">Add Planned Activity</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="activity-id">
            <div class="mb-3">
              <label for="activity-itinerary-id" class="form-label">Itinerary ID</label>
              <input type="number" class="form-control" id="activity-itinerary-id" required>
            </div>
            <div class="mb-3">
              <label for="activity-name" class="form-label">Activity Name</label>
              <input type="text" class="form-control" id="activity-name" required>
            </div>
            <div class="mb-3">
              <label for="activity-scheduled-at" class="form-label">Scheduled At</label>
              <input type="datetime-local" class="form-control" id="activity-scheduled-at" required>
            </div>
            <div class="mb-3">
              <label for="activity-cost" class="form-label">Estimated Cost (INR)</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="activity-cost" required>
            </div>
            <div id="activity-form-error" class="alert alert-danger d-none"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-tt-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/activities.js"></script>
</body>
</html>
