<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Unauthorized - TravelTrek</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card text-center">
      <i class="bi bi-shield-lock" style="font-size: 3rem; color: var(--tt-primary);"></i>
      <h3 class="mt-3 mb-2">403 - Access Denied</h3>
      <p class="auth-subtitle">
        You don't have permission to view this page with your current role<span id="unauth-role"></span>.
      </p>
      <a href="dashboard.html" class="btn btn-tt-primary w-100 mt-2">Back to Dashboard</a>
      <button class="btn btn-outline-secondary w-100 mt-2" id="unauth-logout-btn">Logout</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const user = getCurrentUser();
    if (user) {
      document.getElementById("unauth-role").textContent = ` (${user.role})`;
    }
    document.getElementById("unauth-logout-btn").addEventListener("click", logout);
  </script>
</body>
</html>
