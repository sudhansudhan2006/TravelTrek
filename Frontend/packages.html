<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Packages - TravelTrek</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <!-- Navbar + sidebar injected by renderLayout() -->

  <!-- Add / Edit Package Modal -->
  <div class="modal fade" id="package-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="package-form">
          <div class="modal-header">
            <h5 class="modal-title" id="package-modal-title">Add Package</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="package-id">
            <div class="mb-3">
              <label for="package-name" class="form-label">Package Name</label>
              <input type="text" class="form-control" id="package-name" required>
            </div>
            <div class="mb-3">
              <label for="package-destination" class="form-label">Destination</label>
              <input type="text" class="form-control" id="package-destination" required>
            </div>
            <div class="mb-3">
              <label for="package-price" class="form-label">Base Price (INR)</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="package-price" required>
            </div>
            <div class="mb-3">
              <label for="package-slots" class="form-label">Available Slots</label>
              <input type="number" step="1" min="0" class="form-control" id="package-slots" required>
            </div>
            <div id="package-form-error" class="alert alert-danger d-none"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-tt-primary" id="package-save-btn">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/packages.js"></script>
</body>
</html>
