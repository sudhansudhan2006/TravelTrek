<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Itineraries - TravelTrek</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <!-- Navbar + sidebar injected by renderLayout() -->

  <!-- Add Itinerary Modal -->
  <div class="modal fade" id="itinerary-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="itinerary-form">
          <div class="modal-header">
            <h5 class="modal-title" id="itinerary-modal-title">Add Itinerary</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="itinerary-id">
            <div class="mb-3">
              <label for="itinerary-title" class="form-label">Title</label>
              <input type="text" class="form-control" id="itinerary-title" required>
            </div>
            <div class="mb-3">
              <label for="itinerary-destination" class="form-label">Destination</label>
              <input type="text" class="form-control" id="itinerary-destination" required>
            </div>
            <div class="mb-3">
              <label for="itinerary-budget" class="form-label">Target Budget (INR)</label>
              <input type="number" step="0.01" min="0.01" class="form-control" id="itinerary-budget" required>
            </div>
            <div id="itinerary-form-error" class="alert alert-danger d-none"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-tt-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- View Itinerary Modal -->
  <div class="modal fade" id="view-itinerary-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Itinerary Details</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="view-itinerary-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/itinerary.js"></script>
</body>
</html>
