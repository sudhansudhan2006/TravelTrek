<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TravelTrek</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="text-center mb-3">
        <img src="assets/logo.png" alt="TravelTrek logo" class="auth-logo">
        <h3 class="mb-0">TravelTrek</h3>
        <p class="auth-subtitle">Sign in to plan and manage your trips</p>
      </div>

      <form id="login-form" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input type="email" class="form-control" id="email" required placeholder="you@example.com">
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" class="form-control" id="password" required placeholder="Your password">
        </div>
        <div id="login-error" class="alert alert-danger d-none" role="alert"></div>
        <button type="submit" class="btn btn-tt-primary w-100" id="login-submit-btn">Login</button>
      </form>

      <p class="text-center mt-3 mb-0 auth-subtitle">
        Don't have an account? <a href="register.html">Register here</a>
      </p>
    </div>
  </div>

  <!-- Axios CDN -->
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
  <!-- Bootstrap 5 JS bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/utils.js"></script>

  <script>
    // If already logged in, skip straight to the dashboard.
    if (isAuthenticated()) {
      window.location.href = "dashboard.html";
    }

    const regSuccess = sessionStorage.getItem("tt_reg_success");
    if (regSuccess) {
      showAlert(regSuccess, "success");
      sessionStorage.removeItem("tt_reg_success");
    }

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");
    const submitBtn = document.getElementById("login-submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("d-none");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      showSpinner();
      try {
        const authData = await loginUser(email, password);
        showAlert("Logged in successfully!", "success");
        if (authData.role === "TRAVELER") {
          window.location.href = "dashboard.html";
        } else if (authData.role === "TRAVEL_AGENT") {
          window.location.href = "dashboard.html";
        } else if (authData.role === "AGENCY_MANAGER") {
          window.location.href = "dashboard.html";
        } else {
          window.location.href = "dashboard.html";
        }
      } catch (error) {
        errorBox.textContent = getErrorMessage(error);
        errorBox.classList.remove("d-none");
      } finally {
        hideSpinner();
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
